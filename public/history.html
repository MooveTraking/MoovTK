<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Histórico</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>

<h2>Histórico de Viagens</h2>

<select id="plate"></select>
<input type="datetime-local" id="start">
<input type="datetime-local" id="end">
<button onclick="buscar()">Buscar</button>

<div id="list"></div>
<div id="map" style="height:500px"></div>

<script>
const API = "https://moovtk.onrender.com";
const token = localStorage.getItem("admin_token");

let map = L.map("map").setView([-27,-48],7);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);

let line = null;

async function loadPlates(){
  const r = await fetch(API+"/admin/plates",{headers:{Authorization:"Bearer "+token}});
  const data = await r.json();
  plate.innerHTML="";
  data.plates.forEach(p=>{
    const o=document.createElement("option");
    o.value=p;o.innerText=p;
    plate.appendChild(o);
  });
}
loadPlates();

async function buscar(){
  const p = plate.value;
  const s = start.value;
  const e = end.value;

  const r = await fetch(`${API}/admin/trips/search?plate=${p}&start=${s}&end=${e}`,{
    headers:{Authorization:"Bearer "+token}
  });
  const data = await r.json();

  list.innerHTML="";
  data.trips.forEach(t=>{
    const div=document.createElement("div");
    div.innerHTML = `
      ${t.plate} — ${new Date(t.start_at).toLocaleString()}
      <button onclick="ver('${t.id}')">Ver</button>
    `;
    list.appendChild(div);
  });
}

async function ver(id){
  const r = await fetch(API+"/admin/trips/"+id+"/positions",{
    headers:{Authorization:"Bearer "+token}
  });
  const data = await r.json();

  const coords = data.points.map(p => `${p.lng},${p.lat}`).join(";");

  // OSRM público
  const routeResp = await fetch(
    `https://router.project-osrm.org/match/v1/driving/${coords}?geometries=geojson&overview=full`
  );

  const routeData = await routeResp.json();

  if (!routeData.matchings || !routeData.matchings[0]) {
    alert("Não foi possível ajustar rota às ruas.");
    return;
  }

  const geo = routeData.matchings[0].geometry.coordinates.map(c => [c[1], c[0]]);

  if(line) map.removeLayer(line);
  line = L.polyline(geo, { color: "blue" }).addTo(map);
  map.fitBounds(line.getBounds());
}

</script>

</body>
</html>
