<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Histórico</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>

<h2>Histórico de Viagens</h2>

<input type="date" id="date">
<button onclick="loadTrips()">Buscar</button>

<div id="list"></div>
<div id="map" style="height:500px"></div>

<script>
const API = "https://moovtk.onrender.com";
const token = localStorage.getItem("admin_token");

let map = L.map("map").setView([-27.6,-48.5],7);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);

let line = null;

async function loadTrips(){
  const d = document.getElementById("date").value;

  const r = await fetch(API + "/admin/trips-by-date?date=" + d,{
    headers:{Authorization:"Bearer "+token}
  });

  const data = await r.json();
  list.innerHTML = "";

  data.trips.forEach(t=>{
    const div = document.createElement("div");
    div.innerHTML = `${t.plate} — ${new Date(t.start_at).toLocaleString()} 
      <button onclick="showTrip('${t.id}')">Ver</button>`;
    list.appendChild(div);
  });
}

async function showTrip(id){
  const r = await fetch(API + "/admin/trips/"+id+"/history",{
    headers:{Authorization:"Bearer "+token}
  });

  const data = await r.json();

  const points = data.points.map(p=>[p.lat,p.lng]);

  if(line) map.removeLayer(line);
  line = L.polyline(points,{color:"blue"}).addTo(map);
  map.fitBounds(line.getBounds());
}
</script>
</body>
</html>
