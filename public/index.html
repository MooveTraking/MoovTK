<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Moove Tracking</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://unpkg.com">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

</head>

<body>

<div id="login">
  <div class="login-box">
    <h1>Moove Tracking</h1>
    <input id="email" placeholder="Admin Email">
    <input id="password" type="password" placeholder="Senha">
    <button id="btnLogin">Entrar</button>
    <div id="msg"></div>
  </div>
</div>

<div id="panel" style="display:none;">
  <div class="topbar">
    <h2>Moove Tracking</h2>
    <button id="btnLogout">Sair</button>
  </div>

  <div class="grid">
    <div class="box">
      <h3>Cadastrar Motorista</h3>
      <input id="fCpf" autocomplete="off" placeholder="CPF">
      <input id="fName" autocomplete="off" placeholder="Nome">
      <input id="fPlate" autocomplete="off" placeholder="Placa">
      <input id="fPass" type="password" autocomplete="new-password" placeholder="Senha">

      <button id="btnCreate">Cadastrar</button>
      <div id="msgCreate"></div>
    </div>

    <div class="box">
      <h3>Motoristas</h3>
      <div id="drivers"></div>
    </div>

    <div class="box">
      <h3>Em rota</h3>
      <div id="vehicles"></div>
    </div>
  </div>

  <div id="map"></div>

  <div class="stats">
    <div><b id="count"></b> veículo(s) em rota</div>
    <div id="clock"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
